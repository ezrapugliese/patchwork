<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patchwork</title>
<style>
:root{--nav:#182230;--nav2:#111a25;--paper:#f7edd9;--paper2:#fff8e9;--ink:#2c2930;--muted:#7b7168;--line:#dfd1ba;--accent:#9862c7;--shadow:0 18px 45px #090d1455;--r:13px;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 15% 0,#2a384b,#101822 52%,#0d141d);font-family:var(--font);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{height:100vh;position:sticky;top:0;padding:25px 14px 14px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#dbe2ec;border-right:1px solid #ffffff12;display:flex;flex-direction:column}.brand{font:29px Georgia,serif;color:#faeed2;padding:0 15px 22px}.brand b{color:#d2a7ea}.switcher{width:100%;display:flex;gap:9px;align-items:center;text-align:left;border:1px solid #ffffff15;background:#202d3d;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:18px}.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#d8b5eb;color:#3e2d48;font-weight:800;flex:none}.av.sm{width:29px;height:29px;font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:none;color:#cbd3df;border-radius:9px;padding:11px 12px;text-align:left}.nav button:hover,.nav button.on{background:#2a3850;color:#fff}.nav i{display:inline-block;width:25px;font-style:normal;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #ffffff12;padding:13px 9px}.workspace{display:flex;align-items:center;gap:9px}.main{padding:18px;min-width:0}.wrap{max-width:1190px;margin:auto}.paper{position:relative;overflow:hidden;background:var(--paper);border:1px solid #5b49331f;border-radius:15px;box-shadow:var(--shadow)}.paper:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(#8e775d .55px,transparent .55px);background-size:7px 7px}.page{position:relative;z-index:1;padding:24px;min-height:calc(100vh - 36px)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:15px}.top h1{font:32px Georgia,serif;margin:0}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d7c6a9;background:#f8ead1;color:#342d2b;border-radius:9px;padding:9px 13px;box-shadow:0 2px #5b43251a}.btn:hover{transform:translateY(-1px)}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.grid{display:grid;gap:14px}.g3{grid-template-columns:1.05fr 1.25fr 1.15fr}.g2{grid-template-columns:1fr 1fr}.card{background:#fff9edb8;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 4px 14px #5c43200b}.card h2{font:23px Georgia,serif;margin:0}.label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7c7166;margin-bottom:12px}.member{display:flex;gap:12px;align-items:center}.member .av{width:52px;height:52px}.grow{flex:1;min-width:0}.title{font-weight:750}.big{font:22px Georgia,serif}.desc{font-size:12px;color:#81766c}.status{font-size:12px;color:#53674a;margin-top:3px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#73a75c;margin-right:5px}.row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:9px}.row:hover{background:#f0e5ce}.ico{width:31px;height:31px;display:grid;place-items:center;border-radius:7px}.list{display:grid;gap:5px}.post{padding:14px 0;border-bottom:1px solid #e0d2bc}.post:last-child{border:0}.posthead{display:flex;align-items:center;gap:9px}.postbody{white-space:pre-wrap;margin:7px 0 6px 38px}.postfoot{margin-left:38px;color:#81776e;font-size:12px;display:flex;gap:12px}.tag{display:inline-block;background:#e9ddef;color:#67457a;border-radius:20px;padding:2px 8px;font-size:11px}.tabs{display:flex;gap:17px;border-bottom:1px solid var(--line);margin:0 -24px 18px;padding:0 24px}.tabs button{border:0;background:none;padding:10px 2px;color:#756c64;border-bottom:2px solid transparent}.tabs button.on{color:#5e3975;border-color:var(--accent);font-weight:700}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1}input,textarea,select{border:1px solid #d5c6ae;background:#fff8ea;color:#302b2a;border-radius:9px;padding:10px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9862c71c}textarea{min-height:125px;resize:vertical;width:100%}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#6d635a}.empty{text-align:center;padding:35px 15px;color:#81766d}.activity{border-top:1px solid #e3d5bf}.activity:first-child{border-top:0}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #e1d4bf}.swatches{display:flex;gap:9px}.sw{width:27px;height:27px;border:2px solid transparent;border-radius:50%}.sw.sel{outline:2px solid #493254;outline-offset:2px}.switch{width:43px;height:24px;padding:3px;border:0;border-radius:20px;background:#c7bdad}.switch i{display:block;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(19px)}.modalbg{position:fixed;inset:0;z-index:20;background:#070b11a6;display:grid;place-items:center;padding:18px}.modal{width:min(640px,100%);max-height:90vh;overflow:auto}.mobile{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:30;background:#252f3d;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow)}body.dark .paper{background:#252a34;color:#eee}body.dark .card{background:#2c3039;border-color:#414650}body.dark input,body.dark textarea,body.dark select{background:#20242c;color:#eee;border-color:#454a55}body.dark .btn{background:#30343d;color:#eee;border-color:#4a4f59}body.dark .sub,body.dark .desc,body.dark .postfoot{color:#aaa}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.side.open{display:flex;position:fixed;left:0;top:0;width:280px;z-index:40}.mobile{display:inline-block}.g3,.g2{grid-template-columns:1fr}.settings{grid-template-columns:1fr!important}}@media(max-width:560px){.main{padding:9px}.page{padding:15px}.top h1{font-size:27px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.postbody,.postfoot{margin-left:0}.tabs{margin-left:-15px;margin-right:-15px;padding:0 15px;overflow:auto}.actions{justify-content:flex-end}}
</style></head>
<body><div id="root"></div>
<script>
/* PATCHWORK — one-file local-first app. Edit DEFAULT, CSS variables, and render() to customize. */
const K='patchwork-v1', uid=()=>Math.random().toString(36).slice(2,9), $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT={version:1,active:'p1',profiles:[{id:'p1',name:'Inner World',icon:'◉',term:{members:'Members',boards:'Boards',posts:'Posts',profile:'Profile',fronting:'Fronting'},settings:{theme:'system',accent:'#9862c7',font:15,compact:false,reduced:false,contrast:false},activeMember:'m1',members:[
{id:'m1',name:'Riley',pronouns:'They/Them',avatar:'🌿',color:'#77a65f',desc:'Curious, thoughtful, and usually the one keeping notes organized.',roles:['Host','Protective'],tags:['fronting']},{id:'m2',name:'Jordan',pronouns:'He/Him',avatar:'🌸',color:'#d37ba1',desc:'Likes reminders, practical notes, and water breaks.',roles:['Co-host','Manager'],tags:['care']},{id:'m3',name:'Casey',pronouns:'They/She',avatar:'🌙',color:'#8d6bc0',desc:'Creative and dreamy. Keeps ideas, drawings, and strange little discoveries.',roles:['Creative','Dreamer'],tags:['idea']},{id:'m4',name:'Taylor',pronouns:'She/Her',avatar:'🍂',color:'#d88754',desc:'A gentle caregiver who loves daily-life details.',roles:['Caregiver'],tags:[]},{id:'m5',name:'Morgan',pronouns:'He/They',avatar:'🧭',color:'#d2a848',desc:'Quiet, analytical, and fond of systems.',roles:['Quiet','Analytical'],tags:[]}],boards:[
{id:'b1',name:'General',icon:'✦',color:'#e5b1ae',desc:'General thoughts, updates, and conversations.',pin:false},{id:'b2',name:'Internal World',icon:'▦',color:'#d8b35d',desc:'Notes about our headspace and inner world.',pin:true},{id:'b3',name:'Goals',icon:'▤',color:'#8bb66e',desc:'Short and long-term goals.',pin:true},{id:'b4',name:'Important',icon:'▣',color:'#e2a09b',desc:'Key info, reminders, things to remember.',pin:true},{id:'b5',name:'Dreams',icon:'☁',color:'#b9a4cf',desc:'Dreams, fragments, and half-remembered scenes.',pin:false}],posts:[
{id:'x1',board:'b1',author:'m1',date:'Today at 10:40 AM',text:"Feeling productive today! Let's keep this energy going ✨",tags:['updates'],like:6,reply:2,pin:false},{id:'x2',board:'b1',author:'m2',date:'Today at 9:15 AM',text:'Remember to drink water and take breaks. We got this 💜',tags:['reminder'],like:4,reply:1,pin:false},{id:'x3',board:'b2',author:'m3',date:'Yesterday at 7:45 PM',text:"Drew a thing in the headspace! It's a new playground area.",tags:['idea','internal'],like:0,reply:0,pin:true},{id:'x4',board:'b4',author:'m1',date:'Yesterday',text:"The Library is where we keep important memories and information. It's huge.",tags:['important','memory'],like:8,reply:3,pin:true},{id:'x5',board:'b5',author:'m3',date:'2 days ago',text:'Dream fragment: a little train station under a lavender sky.',tags:['dream'],like:3,reply:1,pin:false}],activity:[['Riley created a new post in General','2h ago','m1'],['Jordan updated their profile','5h ago','m2'],['Casey created a new board: Dreams','Yesterday','m3'],['You pinned a board: Important','Yesterday','m1']],archive:[]} ]};
let D=JSON.parse(localStorage.getItem(K)||'null')||structuredClone(DEFAULT),view='dashboard',selBoard='',query='',modal=null;
const P=()=>D.profiles.find(p=>p.id===D.active)||D.profiles[0], M=id=>P().members.find(x=>x.id===id), B=id=>P().boards.find(x=>x.id===id), T=k=>P().term[k]||k, save=()=>localStorage.setItem(K,JSON.stringify(D));
function theme(){let s=P().settings;document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('font-size',s.font+'px');document.body.classList.toggle('dark',s.theme==='dark'||(s.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches))}function go(v){view=v;document.querySelector('.side')?.classList.remove('open');render()}function av(m,sm=''){return `<span class="av ${sm}" style="background:${m?.color||'#d8b5eb'}">${esc(m?.avatar||'?')}</span>`}
function nav(v,i,l){return `<button class="${view===v?'on':''}" onclick="go('${v}')"><i>${i}</i>${esc(l)}</button>`}
function render(){theme();let p=P();$('root').innerHTML=`<div class="app"><aside class="side"><div class="brand">Patchwork <b>✦</b></div><button class="switcher" onclick="modal='profile';render()">${av({avatar:p.icon,color:'#d8b5eb'},'sm')}<span class="grow"><small>CURRENT ${esc(T('profile').toUpperCase())}</small><br><b>${esc(p.name)}</b></span>⌄</button><nav class="nav">${nav('dashboard','⌂','Dashboard')}${nav('members','♧',T('members'))}${nav('boards','▦',T('boards'))}${nav('posts','✎',T('posts'))}${nav('search','⌕','Search')}${nav('archive','▱','Archive')}${nav('settings','⚙','Settings')}</nav><div class="sidefoot"><div class="workspace">${av(M(p.activeMember),'sm')}<span class="grow"><b>Local workspace</b><br><small>${p.members.length} ${esc(T('members').toLowerCase())}</small></span>＋</div></div></aside><main class="main"><div class="wrap"><div class="top"><div><button class="btn mobile" onclick="document.querySelector('.side').classList.toggle('open')">☰</button><span class="sub">A place for complicated minds.</span></div><div class="actions"><button class="btn" onclick="newPost()">▢ Quick note</button><button class="btn primary" onclick="newPost()">＋ New post</button></div></div><section class="paper"><div class="page">${page()}</div></section></div></main></div>${modal?modalHTML():''}`}
function page(){if(view==='dashboard')return dashboard();if(view==='members')return members();if(view==='boards')return boards();if(view==='posts')return posts();if(view==='search')return search();if(view==='archive')return archive();return settings()}
function dashboard(){let p=P(),m=M(p.activeMember),pins=p.boards.filter(b=>b.pin),recent=p.posts.slice(-3).reverse();return `<div class="top"><div><h1>Good morning, Alex.</h1><div class="sub">Here's what's happening in your world.</div></div><span style="font-size:28px">✧</span></div><div class="grid g3"><div class="card"><div class="label">Current member</div><div class="member">${av(m)}<div class="grow"><div class="big">${esc(m?.name)}</div><div>${esc(m?.pronouns)}</div><div class="status">${esc(T('fronting'))}</div></div></div><button class="btn" style="width:100%;margin-top:15px" onclick="modal='pick';render()">Switch member</button></div><div class="card"><div class="label">Pinned boards</div><div class="list">${pins.map(boardRow).join('')||empty('Pin boards you visit often.')} </div><button class="btn ghost" onclick="go('boards')">View all →</button></div><div class="card"><div class="label">Recent posts</div><div class="list">${recent.map(x=>`<div class="row">${av(M(x.author),'sm')}<div class="grow"><div class="title">${esc(x.text.slice(0,35))}${x.text.length>35?'…':''}</div><div class="desc">${esc(M(x.author)?.name||'Unknown')} · ${esc(x.date)}</div></div></div>`).join('')}</div><button class="btn ghost" onclick="go('posts')">View all →</button></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="top"><h2>Recent activity</h2></div>${p.activity.slice(0,5).map(a=>`<div class="activity"><div class="row">${av(M(a[2]),'sm')}<span class="grow">${esc(a[0])}</span><small>${esc(a[1])}</small></div></div>`).join('')}</div><div class="card"><h2>Quick actions</h2><div class="grid g2" style="margin-top:12px"><button class="btn" onclick="newPost()">＋ New post</button><button class="btn" onclick="newBoard()">▦ New board</button><button class="btn" onclick="newMember()">♧ New ${esc(T('members').replace(/s$/,''))}</button><button class="btn" onclick="newProfile()">▢ New profile</button></div></div></div>`}
function boardRow(b){return `<div class="row" onclick="selBoard='${b.id}';go('posts')"><span class="ico" style="background:${b.color}">${esc(b.icon)}</span><span class="grow"><b>${esc(b.name)}</b><br><span class="desc">${esc(b.desc)}</span></span>›</div>`}function empty(x){return `<div class="empty">${esc(x)}</div>`}
function members(){let p=P(),q=query.toLowerCase();return `<div class="top"><div><h1>${esc(T('members'))}</h1><div class="sub">The people in your ${esc(T('profile').toLowerCase())}.</div></div><button class="btn primary" onclick="newMember()">＋ New</button></div><div class="card"><div class="search"><input placeholder="Search ${esc(T('members').toLowerCase())}…" value="${esc(query)}" oninput="query=this.value;render()"></div><div class="list">${p.members.filter(m=>(m.name+' '+m.desc+' '+m.roles.join(' ')).toLowerCase().includes(q)).map(m=>`<div class="row">${av(m)}<div class="grow"><b>${esc(m.name)}</b> <span class="tag">${esc(m.pronouns)}</span><div class="desc">${esc(m.desc)}</div><div>${m.roles.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div></div><button class="btn" onclick="editMember('${m.id}')">Edit</button><button class="btn" onclick="archive('member','${m.id}')">Archive</button></div>`).join('')||empty('No members match your search.')}</div></div>`}
function boards(){let p=P();return `<div class="top"><div><h1>${esc(T('boards'))}</h1><div class="sub">Your notebooks, channels, and idea spaces.</div></div><button class="btn primary" onclick="newBoard()">＋ New board</button></div><div class="grid g2">${p.boards.map(b=>`<div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="ico" style="width:43px;height:43px;background:${b.color};font-size:20px">${esc(b.icon)}</span><div class="grow"><div class="big">${esc(b.name)}</div><div class="sub">${esc(b.desc)}</div></div><button class="btn" onclick="editBoard('${b.id}')">Edit</button></div><div class="desc" style="margin-top:12px">${p.posts.filter(x=>x.board===b.id).length} notes ${b.pin?' · ★ pinned':''}</div></div>`).join('')}</div>`}
function posts(){let p=P(),list=p.posts.filter(x=>!selBoard||x.board===selBoard),b=B(selBoard);return `<div class="top"><div><h1>${esc(b?.name||T('posts'))}</h1><div class="sub">${esc(b?.desc||'Notes, updates, and conversations.')}</div></div><button class="btn primary" onclick="newPost()">＋ New post</button></div><div class="tabs"><button class="${!selBoard?'on':''}" onclick="selBoard='';render()">All ${esc(T('posts'))}</button>${p.boards.map(x=>`<button class="${selBoard===x.id?'on':''}" onclick="selBoard='${x.id}';render()">${esc(x.name)}</button>`).join('')}</div><div class="card">${list.slice().reverse().map(x=>`<article class="post"><div class="posthead">${av(M(x.author),'sm')}<div><b>${esc(M(x.author)?.name||'Unknown')}</b><div class="desc">${esc(B(x.board)?.name||'')} · ${esc(x.date)}</div></div><div style="margin-left:auto">${x.pin?'★ ':''}<button class="btn" onclick="editPost('${x.id}')">Edit</button><button class="btn" onclick="archive('post','${x.id}')">Archive</button></div></div><div class="postbody">${esc(x.text)}</div><div class="postfoot">${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}<span>♡ ${x.like}</span><span>○ ${x.reply}</span></div></article>`).join('')||empty('Nothing here yet. Start with a note.')}</div>`}
function search(){let p=P(),q=query.toLowerCase();let ms=p.members.filter(m=>(m.name+' '+m.desc+' '+m.tags.join(' ')).toLowerCase().includes(q)),bs=p.boards.filter(b=>(b.name+' '+b.desc).toLowerCase().includes(q)),ps=p.posts.filter(x=>(x.text+' '+x.tags.join(' ')).toLowerCase().includes(q));return `<div class="top"><div><h1>Search</h1><div class="sub">Find anything across this ${esc(T('profile').toLowerCase())}.</div></div></div><div class="search"><input autofocus placeholder="Search everything…" value="${esc(query)}" oninput="query=this.value;render()"></div>${query?`<div class="grid g3"><div class="card"><div class="label">${esc(T('members'))}</div>${ms.map(m=>`<div class="row">${av(m,'sm')}<span class="grow"><b>${esc(m.name)}</b><br><span class="desc">${esc(m.desc)}</span></span></div>`).join('')||empty('No matches.')}</div><div class="card"><div class="label">${esc(T('boards'))}</div>${bs.map(boardRow).join('')||empty('No matches.')}</div><div class="card"><div class="label">${esc(T('posts'))}</div>${ps.map(x=>`<div class="post"><b>${esc(M(x.author)?.name||'Unknown')}</b><div>${esc(x.text)}</div></div>`).join('')||empty('No matches.')}</div></div>`:empty('Start typing to search members, boards, posts, and tags.')}`}
function archive(){let p=P();return `<div class="top"><div><h1>Archive</h1><div class="sub">Recover things without losing your history.</div></div></div><div class="card">${p.archive.length?p.archive.map((x,i)=>`<div class="row"><div class="grow"><b>${esc(x.label)}</b><div class="desc">${esc(x.type)} · ${esc(x.when)}</div></div><button class="btn" onclick="restore(${i})">Restore</button></div>`).join(''):empty('Your archive is empty.')}</div>`}
function settings(){let s=P().settings,p=P();return `<div class="top"><div><h1>Settings</h1><div class="sub">Make Patchwork fit the way your brain works.</div></div></div><div class="grid" style="grid-template-columns:170px 1fr"><div class="list"><button class="btn primary">Appearance</button><button class="btn" onclick="modal='terms';render()">Terminology</button><button class="btn" onclick="exportProfile()">Data</button><button class="btn" onclick="modal='profile';render()">Profile</button></div><div class="card"><h2>Appearance</h2><div class="setting"><div><b>Theme</b><div class="desc">Light, dark, or follow your device.</div></div><select onchange="setting('theme',this.value)"><option value="light" ${s.theme==='light'?'selected':''}>Light</option><option value="dark" ${s.theme==='dark'?'selected':''}>Dark</option><option value="system" ${s.theme==='system'?'selected':''}>System</option></select></div><div class="setting"><div><b>Accent color</b></div><div class="swatches">${['#9862c7','#d46c87','#e89b43','#d5b83f','#72a963','#55a7a7','#5579d5','#7b818d'].map(c=>`<button class="sw ${s.accent===c?'sel':''}" style="background:${c}" onclick="setting('accent','${c}')"></button>`).join('')}</div></div><div class="setting"><div><b>Font size</b></div><div><button class="btn" onclick="setting('font',Math.max(13,s.font-1))">A−</button> <button class="btn">${s.font}px</button> <button class="btn" onclick="setting('font',Math.min(19,s.font+1))">A+</button></div></div><div class="setting"><div><b>Reduced motion</b></div><button class="switch ${s.reduced?'on':''}" onclick="setting('reduced',!s.reduced)"><i></i></button></div><div class="setting"><div><b>High contrast</b></div><button class="switch ${s.contrast?'on':''}" onclick="setting('contrast',!s.contrast)"><i></i></button></div><div style="margin-top:18px"><button class="btn" onclick="exportProfile()">Export profile JSON</button> <button class="btn" onclick="exportAll()">Export everything</button> <button class="btn" onclick="$('file').click()">Import backup</button><input id="file" type="file" accept=".json,application/json" hidden onchange="importJSON(this.files[0])"></div></div></div>`}
function modalHTML(){if(modal==='profile')return `<div class="modalbg" onclick="outside(event)"><div class="modal paper"><div class="page"><div class="top"><h1>Switch ${esc(T('profile').toLowerCase())}</h1><button class="btn" onclick="closeM()">×</button></div><div class="list">${D.profiles.map(p=>`<button class="row btn" onclick="switchP('${p.id}')">${av({avatar:p.icon,color:'#d8b5eb'},'sm')}<span class="grow"><b>${esc(p.name)}</b><br><small>${p.members.length} ${esc(T('members').toLowerCase())}</small></span>${p.id===D.active?'✓':''}</button>`).join('')}</div><button class="btn primary" style="margin-top:14px" onclick="newProfile()">＋ New profile</button></div></div></div>`;if(modal==='pick')return `<div class="modalbg" onclick="outside(event)"><div class="modal paper"><div class="page"><div class="top"><h1>Switch member</h1><button class="btn" onclick="closeM()">×</button></div><div class="list">${P().members.map(m=>`<button class="row btn" onclick="activeM('${m.id}')">${av(m,'sm')}<span class="grow"><b>${esc(m.name)}</b><br><small>${esc(m.pronouns)}</small></span>${P().activeMember===m.id?'✓':''}</button>`).join('')}</div></div></div></div>`;if(modal==='terms')return formModal('Custom terminology','terms');if(typeof modal==='object')return formModal(modal.type,modal.id);return ''}
function formModal(type,id){let p=P(),m=id?M(id):null,b=id?B(id):null,x=id&&type==='post'?p.posts.find(x=>x.id===id):null;let title=type==='member'?'Member':type==='board'?'Board':type==='post'?'Post':'Custom terminology';let body='';if(type==='member')body=`<div class="form"><div class="field"><label>Name</label><input id="f-name" value="${esc(m?.name||'')}"></div><div class="field"><label>Pronouns</label><input id="f-pronouns" value="${esc(m?.pronouns||'')}"></div><div class="field"><label>Avatar</label><input id="f-avatar" value="${esc(m?.avatar||'🌿')}"></div><div class="field"><label>Color</label><input id="f-color" type="color" value="${m?.color||'#9862c7'}"></div><div class="field full"><label>Description</label><textarea id="f-desc">${esc(m?.desc||'')}</textarea></div><div class="field full"><label>Roles, comma separated</label><input id="f-roles" value="${esc(m?.roles?.join(', ')||'')}"></div><div class="field full"><label>Tags, comma separated</label><input id="f-tags" value="${esc(m?.tags?.join(', ')||'')}"></div></div>`;if(type==='board')body=`<div class="form"><div class="field"><label>Name</label><input id="f-name" value="${esc(b?.name||'')}"></div><div class="field"><label>Icon</label><input id="f-icon" value="${esc(b?.icon||'▦')}"></div><div class="field"><label>Color</label><input id="f-color" type="color" value="${b?.color||'#d8b35d'}"></div><div class="field"><label>Pin</label><select id="f-pin"><option value="false">No</option><option value="true" ${b?.pin?'selected':''}>Yes</option></select></div><div class="field full"><label>Description</label><textarea id="f-desc">${esc(b?.desc||'')}</textarea></div></div>`;if(type==='post')body=`<div class="form"><div class="field"><label>Author</label><select id="f-author">${p.members.map(m=>`<option value="${m.id}" ${(x?.author||p.activeMember)===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Board</label><select id="f-board">${p.boards.map(b=>`<option value="${b.id}" ${(x?.board||selBoard||p.boards[0]?.id)===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div class="field full"><label>Text</label><textarea id="f-text" autofocus>${esc(x?.text||'')}</textarea></div><div class="field full"><label>Tags, comma separated</label><input id="f-tags" value="${esc(x?.tags?.join(', ')||'')}"></div></div>`;if(type==='terms')body=`<div class="form">${['members','boards','posts','profile','fronting'].map(k=>`<div class="field"><label>${k}</label><input id="term-${k}" value="${esc(p.term[k])}"></div>`).join('')}</div>`;return `<div class="modalbg" onclick="outside(event)"><div class="modal paper"><div class="page"><div class="top"><h1>${id?'Edit ':'New '}${title}</h1><button class="btn" onclick="closeM()">×</button></div>${body}<div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="saveForm('${type}','${id||''}')">Save</button></div></div></div></div>`}
function outside(e){if(e.target.classList.contains('modalbg'))closeM()}function closeM(){modal=null;render()}function newMember(){modal={type:'member'};render()}function editMember(id){modal={type:'member',id};render()}function newBoard(){modal={type:'board'};render()}function editBoard(id){modal={type:'board',id};render()}function newPost(){modal={type:'post'};render()}function editPost(id){modal={type:'post',id};render()}
function val(id){return $(id)?.value||''}function arr(s){return s.split(',').map(x=>x.trim()).filter(Boolean)}function saveForm(type,id){let p=P();if(type==='terms'){['members','boards','posts','profile','fronting'].forEach(k=>p.term[k]=val('term-'+k));return finish('Terminology saved')}if(type==='member'){let o={id:id||uid(),name:val('f-name'),pronouns:val('f-pronouns'),avatar:val('f-avatar'),color:val('f-color'),desc:val('f-desc'),roles:arr(val('f-roles')),tags:arr(val('f-tags'))};let i=p.members.findIndex(x=>x.id===id);i<0?p.members.push(o):p.members[i]=o;if(!id)p.activeMember=o.id}if(type==='board'){let o={id:id||uid(),name:val('f-name'),icon:val('f-icon'),color:val('f-color'),desc:val('f-desc'),pin:val('f-pin')==='true'};let i=p.boards.findIndex(x=>x.id===id);i<0?p.boards.push(o):p.boards[i]=o}if(type==='post'){let old=p.posts.find(x=>x.id===id),o={id:id||uid(),board:val('f-board'),author:val('f-author'),date:old?.date||'Just now',text:val('f-text'),tags:arr(val('f-tags')),like:old?.like||0,reply:old?.reply||0,pin:old?.pin||false};let i=p.posts.findIndex(x=>x.id===id);i<0?p.posts.push(o):p.posts[i]=o}finish('Saved')}
function finish(msg){save();modal=null;render();toast(msg)}function activeM(id){P().activeMember=id;finish('Active member changed')}function switchP(id){D.active=id;selBoard='';query='';finish('Profile switched')}function setting(k,v){P().settings[k]=v;finish('Setting updated')}function newProfile(){let n=prompt('Profile name','New World');if(!n)return;let p=structuredClone(DEFAULT.profiles[0]);p.id=uid();p.name=n;p.icon='✦';p.members=[];p.boards=[];p.posts=[];p.activity=[];p.archive=[];D.profiles.push(p);D.active=p.id;modal=null;finish('Profile created')}
function archive(type,id){let p=P(),a=p[type+'s'],i=a.findIndex(x=>x.id===id);if(i<0)return;let x=a.splice(i,1)[0];p.archive.push({type,id,label:x.name||x.text?.slice(0,55)||'Item',when:new Date().toLocaleDateString(),data:x});finish('Archived — recover it from Archive')}function restore(i){let p=P(),x=p.archive[i];if(x.type==='member')p.members.push(x.data);if(x.type==='board')p.boards.push(x.data);if(x.type==='post')p.posts.push(x.data);p.archive.splice(i,1);finish('Restored')}
function download(obj,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function exportProfile(){download(P(),'patchwork-profile.json')}function exportAll(){download(D,'patchwork-backup.json')}function importJSON(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.version||!x.profiles)throw 0;D=x;save();render();toast('Backup imported')}catch(e){alert('That file is not a valid Patchwork backup.')}};r.readAsText(file)}function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go('search')}});render();
</script></body></html>
