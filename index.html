<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>patchwork v0.0.1</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>

<body>
    <main>
        <header id="main-head" class="main-box">
            <div class="header-content">
                <span id="header-logo" class="icon-small"><img src="assets/icon.png"
                        placeholder="logo"></span><span>patchwork - v0.0.1</span>
            </div>
            <div class="mobile-controls" aria-label="Sidebar controls">
                <button class="sidebar-toggle left-toggle" type="button" aria-label="Open left sidebar" aria-expanded="false">
                    ☰
                </button>
                <button class="sidebar-toggle right-toggle" type="button" aria-label="Open right sidebar" aria-expanded="false">
                    ☰
                </button>
            </div>
        </header>
        <nav id="navigation" class="main-box">
            <span class="button-nav">placeholder</span>
        </nav>
        <aside id="sidebar-left" class="main-box">
            <ul>
                <li><span class="button-sidebar"><span class="icon-small"><img src="assets/icon-dashboard.png"
                                placeholder="logo"></span>Dashboard</span></li>
                <li><span class="button-sidebar"><span class="icon-small"><img src="assets/icon-system.png"
                                placeholder="logo"></span>System</span></li>
                <li><span class="button-sidebar"><span class="icon-small"><img src="assets/icon-alters.png"
                                placeholder="logo"></span>Alters</span></li>
                <li><span class="button-sidebar"><span class="icon-small"><img src="assets/icon-settings.png"
                                placeholder="logo"></span>Settings</span></li>
            </ul>
        </aside>
        <div id="body" class="main-box">
            <p>main</p>
        </div>
        <aside id="sidebar-right" class="main-box">right sidebar</aside>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
